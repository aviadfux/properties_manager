# Local development only: a PostgreSQL server on this computer. Production uses the host's managed
# PostgreSQL (docs/BUILD_PLAN.md). The password below is for the local database and nothing else.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: pm_owner
      POSTGRES_PASSWORD: pm_local_dev
      POSTGRES_DB: pm_dev
    ports:
      - "127.0.0.1:5432:5432" # reachable from this computer only
    volumes:
      - pm_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm_owner -d pm_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pm_db:
